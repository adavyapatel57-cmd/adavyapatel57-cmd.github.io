<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adavya's Study Hub</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    color: white;
    overflow-x: hidden;

    background:
        radial-gradient(circle at 15% 10%, rgba(0,119,255,.25), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(0,204,255,.18), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(30,70,255,.13), transparent 35%),
        linear-gradient(135deg, #030b18, #071a35 48%, #020914);

    background-attachment: fixed;
}

/* =========================================================
   DECORATIVE GLOW
========================================================= */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .18;
    pointer-events: none;
    z-index: -1;
}

body::before {
    background: #008cff;
    top: 10%;
    left: -150px;
}

body::after {
    background: #0055ff;
    bottom: 5%;
    right: -150px;
}

/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    width: 100%;
    padding: 14px 6%;

    background: rgba(3,12,27,.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255,255,255,.10);
}

.nav-content {
    max-width: 1200px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: .4px;

    text-shadow: 0 0 18px rgba(0,153,255,.55);
}

.nav-links {
    display: flex;
    gap: 26px;
}

.nav-links a {
    position: relative;

    color: rgba(255,255,255,.82);
    text-decoration: none;

    font-weight: 700;
    font-size: 14px;

    transition: .25s ease;
}

.nav-links a::after {
    content: "";
    position: absolute;

    left: 50%;
    bottom: -7px;

    width: 0;
    height: 2px;

    background: #42a5ff;
    box-shadow: 0 0 10px #168cff;

    transition: .25s ease;
}

.nav-links a:hover {
    color: white;
}

.nav-links a:hover::after {
    left: 0;
    width: 100%;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    text-align: center;
    padding: 85px 20px 45px;
}

.welcome {
    font-size: clamp(46px, 9vw, 82px);
    font-weight: 950;
    letter-spacing: 4px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #75c8ff,
        #ffffff
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow: 0 0 35px rgba(0,132,255,.28);

    animation: heroGlow 3s ease-in-out infinite alternate;
}

@keyframes heroGlow {
    from {
        filter: drop-shadow(0 0 5px rgba(0,132,255,.15));
    }

    to {
        filter: drop-shadow(0 0 22px rgba(0,132,255,.35));
    }
}

.hero p {
    margin-top: 15px;

    color: rgba(255,255,255,.72);
    font-size: 17px;
    letter-spacing: .5px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-area {
    width: min(760px, 92%);
    margin: 0 auto 30px;
}

.search-box {
    width: 100%;

    padding: 17px 22px;

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;

    outline: none;

    background: rgba(255,255,255,.075);
    backdrop-filter: blur(16px);

    color: white;
    font-size: 16px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition: .25s ease;
}

.search-box::placeholder {
    color: rgba(255,255,255,.55);
}

.search-box:focus {
    border-color: rgba(50,160,255,.65);

    box-shadow:
        0 0 0 4px rgba(0,132,255,.10),
        0 12px 45px rgba(0,90,255,.18);
}

/* =========================================================
   FILTERS
========================================================= */

.filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;

    width: min(1000px, 94%);
    margin: 0 auto 42px;
}

.filter {
    border: 1px solid rgba(255,255,255,.13);

    background: rgba(255,255,255,.065);
    color: rgba(255,255,255,.8);

    padding: 10px 18px;
    border-radius: 999px;

    cursor: pointer;
    font-weight: 700;

    backdrop-filter: blur(12px);

    transition: .25s ease;
}

.filter:hover {
    transform: translateY(-2px);
    border-color: rgba(70,170,255,.45);
    color: white;
}

.filter.active {
    background: linear-gradient(135deg, #ffffff, #ccecff);
    color: #075bd8;

    border-color: white;

    box-shadow: 0 8px 25px rgba(0,119,255,.22);
}

/* =========================================================
   GRID
========================================================= */

.container {
    width: min(1200px, 92%);
    margin: auto;
}

.resource-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 22px;

    padding-bottom: 55px;
}

/* =========================================================
   CARDS
========================================================= */

.card {
    position: relative;
    overflow: hidden;

    min-height: 325px;

    padding: 20px;

    border-radius: 26px;

    border: 1px solid rgba(255,255,255,.16);

    box-shadow:
        0 18px 45px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.12);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.card::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            transparent 35%
        );

    pointer-events: none;
}

.card:hover {
    transform: translateY(-9px);

    border-color: rgba(255,255,255,.30);

    box-shadow:
        0 25px 60px rgba(0,0,0,.38),
        0 0 25px rgba(0,130,255,.10);
}

/* SHINE */

.card::before {
    content: "";

    position: absolute;

    top: -120%;
    left: -80%;

    width: 50%;
    height: 300%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.25),
        transparent
    );

    transform: rotate(25deg);

    transition: left .7s ease;

    pointer-events: none;

    z-index: 2;
}

.card:hover::before {
    left: 145%;
}

/* =========================================================
   CARD COLORS
========================================================= */

.next {
    background:
        linear-gradient(
            145deg,
            rgba(0,126,40,.96),
            rgba(8,176,63,.82)
        );
}

.mission {
    background:
        linear-gradient(
            145deg,
            rgba(164,0,0,.97),
            rgba(235,30,30,.82)
        );
}

.pw {
    background:
        linear-gradient(
            145deg,
            rgba(5,5,7,.98),
            rgba(34,34,39,.92)
        );
}

.piott {
    background:
        linear-gradient(
            145deg,
            rgba(86,20,190,.97),
            rgba(137,52,255,.84)
        );
}

/* =========================================================
   CARD IMAGE
========================================================= */

.card-image {
    position: relative;
    z-index: 3;

    width: 100%;
    height: 145px;

    object-fit: contain;

    border-radius: 18px;

    margin-bottom: 16px;

    padding: 8px;

    background: rgba(0,0,0,.13);

    border: 1px solid rgba(255,255,255,.10);

    transition: transform .3s ease;
}

.card:hover .card-image {
    transform: scale(1.035);
}

/* =========================================================
   CARD TEXT
========================================================= */

.card h2,
.card p,
.card .launch {
    position: relative;
    z-index: 4;
}

.card h2 {
    font-size: 21px;
    margin-bottom: 7px;
}

.card p {
    font-size: 14px;
    line-height: 1.5;
    color: rgba(255,255,255,.83);
}

/* =========================================================
   LAUNCH BUTTON
========================================================= */

.launch {
    display: block;

    margin-top: 18px;
    width: 100%;

    padding: 13px 18px;

    border-radius: 15px;

    text-align: center;
    text-decoration: none;

    color: white;

    background: rgba(255,255,255,.105);

    border: 1px solid rgba(255,255,255,.25);

    font-weight: 900;
    letter-spacing: 1.4px;

    backdrop-filter: blur(8px);

    transition: .25s ease;
}

.launch:hover {
    background: rgba(255,255,255,.23);

    transform: translateY(-2px);

    box-shadow: 0 8px 25px rgba(0,0,0,.18);
}

/* =========================================================
   IMPORTANT
========================================================= */

.important {
    width: min(900px, 92%);
    margin: 0 auto 45px;

    padding: 28px 22px;

    text-align: center;

    border-radius: 24px;

    background: rgba(255,255,255,.065);

    border: 1px solid rgba(255,255,255,.13);

    backdrop-filter: blur(18px);

    box-shadow:
        0 20px 55px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.important h2 {
    margin-bottom: 8px;
    font-size: 22px;
}

.important p {
    color: rgba(255,255,255,.68);
    line-height: 1.5;
}

/* =========================================================
   VIDEO
========================================================= */

.video-section {
    width: min(1000px, 92%);
    margin: 40px auto;

    padding: 22px;

    background: rgba(255,255,255,.065);

    border: 1px solid rgba(255,255,255,.14);

    border-radius: 26px;

    backdrop-filter: blur(18px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.video-section h2 {
    text-align: center;
    margin-bottom: 18px;
}

.video-container {
    width: 100%;

    aspect-ratio: 16 / 9;

    border-radius: 19px;

    overflow: hidden;

    background: #000;

    border: 1px solid rgba(255,255,255,.12);

    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}

.video-container iframe {
    width: 100%;
    height: 100%;

    border: none;
}

/* =========================================================
   FOOTER
========================================================= */

footer {
    margin-top: 30px;

    text-align: center;

    padding: 28px 15px;

    background: rgba(2,15,38,.72);

    border-top: 1px solid rgba(255,255,255,.10);

    color: rgba(255,255,255,.70);

    font-size: 14px;
}

/* =========================================================
   BACK TO TOP
========================================================= */

.top-btn {
    position: fixed;

    right: 20px;
    bottom: 22px;

    width: 47px;
    height: 47px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;

    background: rgba(255,255,255,.90);
    color: #0066ee;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 10px 30px rgba(0,0,0,.30);

    display: none;

    transition: .25s ease;
}

.top-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(0,100,255,.25);
}

/* =========================================================
   INSTAGRAM POPUP
========================================================= */

.overlay {
    position: fixed;
    inset: 0;

    z-index: 2000;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(0,12,35,.72);

    backdrop-filter: blur(9px);
}

.instagram-popup {
    width: min(400px, 100%);

    padding: 32px 25px;

    text-align: center;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(15,125,255,.96),
            rgba(0,61,185,.96)
        );

    border: 1px solid rgba(255,255,255,.25);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        0 0 35px rgba(0,111,255,.18);

    animation: popup .35s ease;
}

@keyframes popup {
    from {
        opacity: 0;
        transform: scale(.88) translateY(10px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.insta-icon {
    font-size: 48px;
    margin-bottom: 10px;
}

.instagram-popup h2 {
    margin-bottom: 8px;
}

.instagram-popup p {
    opacity: .9;
    margin-bottom: 20px;
}

.insta-follow,
.skip {
    display: block;

    width: 100%;

    padding: 13px;

    border-radius: 14px;

    text-decoration: none;

    font-weight: 800;

    margin-top: 10px;

    transition: .2s ease;
}

.insta-follow {
    background: white;
    color: #075bd8;
}

.insta-follow:hover {
    transform: translateY(-2px);
}

.skip {
    color: white;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.10);

    cursor: pointer;
}

/* =========================================================
   WEBSITE LAUNCH POPUP
========================================================= */

.site-overlay {
    position: fixed;
    inset: 0;

    z-index: 3000;

    display: none;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(0,5,20,.86);

    backdrop-filter: blur(10px);
}

.site-popup {
    position: relative;

    width: min(1200px, 96vw);
    height: min(800px, 90vh);

    background: white;

    border-radius: 24px;

    overflow: hidden;

    box-shadow:
        0 30px 100px rgba(0,0,0,.60),
        0 0 40px rgba(0,110,255,.15);

    animation: sitePopup .3s ease;
}

@keyframes sitePopup {
    from {
        opacity: 0;
        transform: scale(.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.site-close {
    position: absolute;

    top: 12px;
    right: 12px;

    z-index: 10;

    width: 44px;
    height: 44px;

    border: none;
    border-radius: 50%;

    background: rgba(0,0,0,.80);
    color: white;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 18px rgba(0,0,0,.35);

    transition: .2s ease;
}

.site-close:hover {
    background: #e00000;
    transform: rotate(5deg);
}

.site-frame {
    width: 100%;
    height: 100%;

    border: none;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 850px) {

    .resource-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .navbar {
        padding: 13px 18px;
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding: 60px 15px 35px;
    }

    .welcome {
        font-size: 47px;
        letter-spacing: 2px;
    }

    .hero p {
        font-size: 15px;
    }

    .search-area {
        width: 92%;
    }

    .search-box {
        padding: 15px 18px;
    }

    .filters {
        gap: 8px;
    }

    .filter {
        padding: 9px 14px;
        font-size: 13px;
    }

    .resource-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .card {
        min-height: auto;
        border-radius: 24px;
    }

    .card-image {
        height: 160px;
    }

    .important {
        padding: 24px 18px;
    }

    .video-section {
        width: 92%;
        padding: 15px;
        border-radius: 22px;
    }

    .video-container {
        border-radius: 15px;
    }

    .site-overlay {
        padding: 8px;
    }

    .site-popup {
        width: 100%;
        height: 94vh;
        border-radius: 17px;
    }

    .site-close {
        width: 40px;
        height: 40px;
        font-size: 21px;
    }

    .top-btn {
        right: 16px;
        bottom: 17px;
    }

}

</style>
</head>
